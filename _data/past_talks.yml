- number: 1
  title: |
    Higher Derivative Theories: the Good, the Bad and the Ugly
  speaker: |
    Richard P Woodard (University of Florida, USA)
  date: |
    October 6th, 2026
  youtube_id: |
    AgvMp_IOdWc
  thumbnail: /assets/img/Thumbnails/Woodard_06_10_2026.png
  abstract: |
    Aside from philosophical interest, Lagrangians that contain higher time derivatives hold great interest for quantum gravity owing to the theorem of the late Kelly Stelle that adding fundamental Ricci-squared and Weyl-squared terms to the Hilbert action would result in a perturbatively renormalizable theory. The reason we still have a ``problem of quantum gravity'' is that the Weyl-squared term is not allowed. I explain why not, and hopefully debunk some of the confused and confusing literature on this subject. 

    This talk is based on <a href="https://arxiv.org/abs/astro-ph/0601672" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">astro-ph/0601672</a>, <a href="https://arxiv.org/abs/2306.09596" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">arXiv:2306.09596</a>, <a href="https://arxiv.org/abs/1506.02210" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">arXiv:1506.022</a> and <a href="https://arxiv.org/abs/2602.16190" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;"> arXiv:2602.16190.</a>. The slides can be found <a href="/assets/Slides/Woodard 06_10_2026.pdf" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">here</a>
