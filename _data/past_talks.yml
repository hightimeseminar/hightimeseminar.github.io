- number: 4
  title: |
    Emergent Time, a Scalar-Tensor Extension of Quadratic Gravity, and a Possible Resolution of the Ghost Problem
  speaker: |
    Shinji Mukohyama (RESCEU, University of Tokyo & YITP, Kyoto University)
  date: |
    November 3rd, 2026
  youtube_id: | 
    GfQEcPWyQHA
     
  thumbnail: /assets/img/Thumbnails/Mukohyama_03_11_2026.png
  abstract: |
    We present a scenario in which time and Lorentzian signature emerge
    from a Riemannian theory through a nontrivial scalar-field
    configuration. At short distances, the system is described by a
    renormalizable scalar-tensor theory of gravity with a
    positive-definite metric. At long distances, under certain conditions,
    it contains a massless spin-2 mode with a Lorentzian dispersion
    relation. This construction may evade the ghost problem of quadratic
    gravity. We also briefly discuss applications and the inclusion of the
    Standard Model.
    <br /><br />
    For the papers referred to in the talk see <a href="https://arxiv.org/abs/1301.1361" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">arXiv: 1301.1361</a>,
    <a href="https://arxiv.org/abs/1303.1409" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">arxiv: 1303.1409 </a>
    <a href="https://arxiv.org/abs/1403.0580" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">arXiv: 1403.0580 </a>
    <a href="https://arxiv.org/abs/2310.17266" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">arXiv: 2310.17266 </a>
    <a href="https://arxiv.org/abs/2505.00112" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">arXiv: 2505.00112 </a>
    <a href="https://arxiv.org/abs/2602.02646" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">arXiv: 2602.02646 </a>.   
    
    The slides used in the talk can be found <a href="/assets/Slides/Mukohyama_03_11_2026.pdf" target="_blank" rel="noopener noreferrer" style="color:#bb446c; font-weight:bold;">here</a>.
    
