<style>
  /* Hide standard Beautiful Jekyll default header on pages with this banner */
  .header-section {
    display: none !important;
  }

  /* Expand wide desktop layout for hero pages */
  @media (min-width: 1200px) {
    .container, 
    .container-md, 
    .container-xl, 
    div[role="main"] {
      max-width: 1140px !important;
      width: 100% !important;
      margin-right: auto !important;
      margin-left: auto !important;
    }
    
    div[role="main"] .row > div,
    .col-lg-8,
    .col-xl-8,
    .main-content {
      width: 100% !important;
      max-width: 100% !important;
      flex: 0 0 100% !important;
      margin-right: auto !important;
      margin-left: auto !important; 
    }
  }

  /* Hero Banner Layout & Alignment */
  .page-title.hero-banner {
    position: relative !important;
    height: 270px !important;
    min-height: 220px !important;
    padding-top: 60px !important;
    padding-bottom: 0 !important;
    padding-left: 15px !important;
    padding-right: 15px !important;
    box-sizing: border-box !important;
    overflow: hidden;

    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    background-color: #000000 !important; /* Pure black backdrop */
    margin-bottom: 30px !important;
  }

  .hero-image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center; /* Default fallback alignment */
    z-index: 0;
    opacity: 0;
  }

  /* FAST LOAD / CACHED: Instantly visible */
  .hero-image.instant {
    opacity: 1 !important;
    transition: none !important;
  }

  /* SLOW LOAD: Smooth fade-in */
  .hero-image.fade-in {
    opacity: 1 !important;
    transition: opacity 0.4s ease-in-out !important;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 900px;
    text-align: center;
    margin: 0 auto;
  }

  .hero-content h1 {
    margin: 0 0 6px 0 !important;
    color: #ffffff !important;
    white-space: nowrap !important;
    font-size: clamp(0.95rem, 3.8vw, 2.3rem) !important;
    line-height: 1.2 !important;
    text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8) !important;
  }

  .hero-content .subtitle {
    margin: 0 !important;
    color: #e0e0e0 !important;
    font-size: clamp(0.8rem, 2.2vw, 1.15rem) !important;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8) !important;
  }

  @media (max-width: 768px) {
    .page-title.hero-banner {
      height: 210px !important;
      padding-top: 50px !important;
    }
  }
</style>

<div class="page-title hero-banner">
  <img
    src="{{ include.image | relative_url }}"
    class="hero-image"
    alt=""
    aria-hidden="true"
    loading="eager"
    fetchpriority="high"
    {% if include.position %}style="object-position: {{ include.position }};"{% endif %}
  >
  <div class="hero-content">
    <h1 class="mono-bold">{{ include.title }}</h1>
    {% if include.subtitle %}
      <p class="subtitle mono-text">{{ include.subtitle }}</p>
    {% endif %}
  </div>

  <script>
    (function() {
      var img = document.querySelector('.hero-banner .hero-image');
      if (!img) return;
      var startTime = performance.now();

      function showImage() {
        var elapsed = performance.now() - startTime;
        if (elapsed > 150) {
          img.classList.add('fade-in');
        } else {
          img.classList.add('instant');
        }
      }

      if (img.complete) {
        showImage();
      } else {
        img.addEventListener('load', showImage);
      }
    })();
  </script>
</div>
